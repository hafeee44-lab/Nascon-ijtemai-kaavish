services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Self-hosted media server: RTMP 1935, HLS 8888, WebRTC (WHIP/WHEP) 8889.
  mediamtx:
    # The -ffmpeg variant ships a shell + wget, so the media server can report a real health status.
    image: bluenviron/mediamtx:1.9.1-ffmpeg
    ports:
      - "1935:1935"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    environment:
      MTX_AUTHHTTPADDRESS: ${MEDIA_AUTH_URL:-http://api:8080/internal/media/auth}
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
      - recordings:/recordings
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DAY2_SALT: ${DAY2_SALT}
      DATABASE_URL: postgres://nascon:nascon@postgres:5432/nascon
      REDIS_URL: redis://redis:6379
      MEDIAMTX_API_URL: http://mediamtx:9997
      RECORDINGS_DIR: /recordings
      JWT_SECRET: ${JWT_SECRET:-nascon-dev-jwt-secret-change-me}
      PORT: "8080"
    volumes:
      - recordings:/recordings:ro
    sysctls:
      net.core.somaxconn: 4096
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # Selenium Grid 4: hub on 4444 + 3 browser nodes (spec §6.2.1). Image names are overridable so
  # Apple Silicon laptops can use node-chromium locally; the defaults are what the grader pulls.
  selenium-hub:
    image: ${SELENIUM_HUB_IMAGE:-selenium/hub:4.25.0}
    container_name: nascon-selenium-hub
    ports:
      - "4444:4444"
      - "4442:4442"
      - "4443:4443"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status | grep -q '\"ready\": *true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  node-chrome-1:
    image: ${SELENIUM_CHROME_IMAGE:-selenium/node-chrome:4.25.0}
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: &node-env
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_START_VNC=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: &node-health
      test: ["CMD-SHELL", "curl -sf http://localhost:5555/status >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  node-chrome-2:
    image: ${SELENIUM_CHROME_IMAGE:-selenium/node-chrome:4.25.0}
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *node-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *node-health

  node-firefox:
    image: ${SELENIUM_FIREFOX_IMAGE:-selenium/node-firefox:4.25.0}
    shm_size: "1gb"
    depends_on: [selenium-hub]
    environment: *node-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck: *node-health

  # Optional S3 object store for VOD archives. The public MinIO image is no longer pullable
  # (Docker Hub repo removed, quay.io requires auth), so it is opt-in: `--profile objectstore`.
  minio:
    profiles: ["objectstore"]
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-09-22T00-33-43Z}
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: nascon
      MINIO_ROOT_PASSWORD: nascon-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - vod:/data

volumes:
  recordings:
  vod:
