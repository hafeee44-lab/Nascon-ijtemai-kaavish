<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111411"><title>Club House — Club & League Management</title><style>
@font-face{font-family:Barlow-Regular;src:url(/fonts/Barlow-Regular.ttf);font-display:swap}@font-face{font-family:Barlow-SemiBold;src:url(/fonts/Barlow-SemiBold.ttf);font-display:swap}@font-face{font-family:BarlowCondensed-Bold;src:url(/fonts/BarlowCondensed-Bold.ttf);font-display:swap}
