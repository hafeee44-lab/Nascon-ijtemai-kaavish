name: autograde

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  autograde:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Real salts come from repository secrets; CI falls back to throwaway values (never commit real salts).
      DAY1_SALT: ${{ secrets.DAY1_SALT || 'ci-day1-salt' }}
      DAY2_SALT: ${{ secrets.DAY2_SALT || 'ci-day2-salt' }}
    steps:
      - uses: actions/checkout@v4

      - name: Start full stack (API, DB, Redis, MediaMTX, Selenium Grid)
        run: docker compose up -d --build

      - name: Wait for /health
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:8080/health && exit 0; sleep 2; done
          docker compose logs api; exit 1

      - name: Selenium Grid ready with >= 3 nodes
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4444/status | python3 -c 'import sys,json; v=json.load(sys.stdin)["value"]; sys.exit(0 if v["ready"] and len(v["nodes"])>=3 else 1)'; then exit 0; fi
            sleep 3
          done
          curl -s http://localhost:4444/status; exit 1

      - name: Backend unit tests + coverage
        run: ./run_tests.sh

      - name: Contract probes (Day 1 regression + Day 2)
        run: |
          python3 tests/smoke_test.py --fast
          python3 tests/smoke_day2.py

      - name: Selenium Grid suite (3 parallel sessions)
        run: |
          pip install -q selenium pytest pytest-xdist
          mkdir -p tests/reports
          APP_URL=http://api:8080 python3 -m pytest -n 3 tests/selenium --junitxml=tests/reports/selenium-report.xml

      - name: k6 load (NFR-2 profile)
        run: |
          curl -s -X POST http://localhost:8080/audit/v1/reset > /dev/null
          docker run --rm --network host -v "$PWD:/w" -w /w grafana/k6:0.54.0 run --summary-export=tests/reports/k6-summary.json tests/k6_load.js

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/reports/

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 200
